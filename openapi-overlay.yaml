# OpenAPI Overlay for MistralAPI
# This file allows you to make manual corrections to the OpenAPI specification
# without modifying the original file. The bootstrapper will apply this overlay
# on top of the cleaned openapi.yaml file.
#
# For overlay syntax, see: https://github.com/OAI/Overlay-Specification

overlay: 1.0.0
info:
  title: MistralAPI API Overlay
  version: 1.0.0

# Example actions (uncomment and modify as needed):
# actions:
#   # Make a field required
#   - target: "$.components.schemas.User"
#     update:
#       required:
#         - user_id
#         - email
#
#   # Add a missing property
#   - target: "$.components.schemas.Product"
#     update:
#       properties:
#         newField:
#           type: string
#           description: "A field that was missing in the original spec"
#
#   # Fix an incorrect type
#   - target: "$.components.schemas.Order.properties.total"
#     update:
#       type: number
#       format: double
#
#   # Remove a deprecated field
#   - target: "$.components.schemas.LegacyModel.properties.oldField"
#     remove: true

actions:
  - remove: true
    target: $.components.schemas.TranscriptionResponse.required
  - target: $.components.schemas.TranscriptionResponse
    update:
      required:
      - model
      - text
      - usage
  - remove: true
    target: $.components.schemas.EmbeddingResponse.allOf[1].properties.data.items
  - remove: true
    target: $.components.schemas.TranscriptionResponse.properties.language.anyOf
  - target: $.components.schemas.TranscriptionResponse.properties.language
    update:
      pattern: ^\w{2}$
      title: Language
      type: string
  - target: $.components.schemas.EmbeddingResponse.allOf[1].properties.data
    update:
      items:
        $ref: '#/components/schemas/EmbeddingResponseData'
  - target: $.components.schemas.UsageInfo.properties.prompt_audio_seconds
    update:
      title: Prompt Audio Seconds
      type: integer
  - remove: true
    target: $.components.schemas.UsageInfo.properties.prompt_audio_seconds.anyOf
  - remove: true
    target: $.components.schemas.UsageInfo.properties.prompt_audio_seconds.nullable
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.file.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.file.default
  - target: $.components.schemas.AudioTranscriptionRequest.properties.file
    update:
      $ref: '#/components/schemas/File'
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.file_url.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.file_url.default
  - target: $.components.schemas.AudioTranscriptionRequest.properties.file_url
    update:
      format: uri
      maxLength: 2083
      minLength: 1
      type: string
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.file_id.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.file_id.default
  - target: $.components.schemas.AudioTranscriptionRequest.properties.file_id
    update:
      type: string
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.language.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.language.default
  - target: $.components.schemas.AudioTranscriptionRequest.properties.language
    update:
      pattern: ^\w{2}$
      type: string
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.temperature.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequest.properties.temperature.default
  - target: $.components.schemas.AudioTranscriptionRequest.properties.temperature
    update:
      type: number
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.file.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.file.default
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.file
    update:
      $ref: '#/components/schemas/File'
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.file_url.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.file_url.default
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.file_url
    update:
      format: uri
      maxLength: 2083
      minLength: 1
      type: string
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.file_id.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.file_id.default
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.file_id
    update:
      type: string
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.language.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.language.default
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.language
    update:
      pattern: ^\w{2}$
      type: string
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.temperature.anyOf
  - remove: true
    target: $.components.schemas.AudioTranscriptionRequestStream.properties.temperature.default
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.temperature
    update:
      type: number
  - target: $.components.schemas
    update:
      APIError:
        type: object
        additionalProperties: true
        required: [message, object, type]
        properties:
          object:
            type: string
            enum: [error]
          type:
            type: string
          param:
            type: string
            nullable: true
          code:
            nullable: true
            oneOf:
              - type: string
              - type: integer
          raw_status_code:
            type: integer
          message:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  code:
                    nullable: true
                    oneOf:
                      - type: string
                      - type: integer
                  detail:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      required: [msg, type]
                      properties:
                        msg:
                          type: string
                        type:
                          type: string
                        loc:
                          type: array
                          items: {}
                        input: {}
                        ctx: {}
                        url:
                          type: string
      AuthenticationErrorResponse:
        type: object
        required: [detail]
        additionalProperties: true
        properties:
          detail:
            type: string
  - target: $.paths['/v1/audio/transcriptions'].post.responses
    update:
      '400':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIError'
        description: Bad Request - Invalid model or request parameters
      '422':
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIError'
        description: Unprocessable Entity - Missing required parameters
  - target: $.components.schemas.TranscriptionResponse.properties
    update:
      finish_reason:
        title: Finish Reason
        type: string
  - target: $.components.schemas.TranscriptionResponse.properties
    update:
      type:
        title: Type
        type: string
  - target: $.components.schemas.UsageInfo.properties
    update:
      num_cached_tokens:
        default: 0
        title: Num Cached Tokens
        type: integer
  - target: $.components.schemas.UsageInfo.properties
    update:
      request_count:
        title: Request Count
        type: integer
  - target: $.components.schemas
    update:
      PromptTokensDetails:
        additionalProperties: true
        properties:
          audio_tokens:
            title: Audio Tokens
            type: integer
          cached_tokens:
            title: Cached Tokens
            type: integer
        title: Prompt Tokens Details
        type: object
  - target: $.components.schemas.UsageInfo.properties
    update:
      prompt_tokens_details:
        $ref: '#/components/schemas/PromptTokensDetails'
  # Live transcription responses can include fields absent from the published spec.
  - target: $.components.schemas.TranscriptionResponse
    update:
      additionalProperties: true
  - target: $.components.schemas.UsageInfo
    update:
      additionalProperties: true
      properties:
        service_tier:
          title: Service Tier
          type: string
          description: The service tier at which the request was processed.
  # Mistral concatenates repeated multipart fields; send one value per field.
  - target: $.components.schemas.AudioTranscriptionRequest.properties.context_bias
    remove: true
  - target: $.components.schemas.AudioTranscriptionRequest.properties.timestamp_granularities
    remove: true
  - target: $.components.schemas.AudioTranscriptionRequest.properties
    update:
      context_bias:
        type: string
        description: "Comma-separated terms, without whitespace or commas inside a term (voxtral-mini-2602); at most 100."
        pattern: '^[^,\s]+(,[^,\s]+)*$'
      timestamp_granularities:
        $ref: '#/components/schemas/TimestampGranularity'
  - target: $.components.schemas.AudioTranscriptionRequest.properties.temperature
    update:
      minimum: 0
      maximum: 1.5
  - target: $.components.schemas.AudioTranscriptionRequest.properties.diarize
    update:
      description: "Speaker diarization. When not streaming, requires timestamp_granularities=segment. Speaker IDs are speaker_1, speaker_2, and so on."
  - target: $.components.schemas.AudioTranscriptionRequest.properties.language
    update:
      description: "Language of the audio, e.g. 'en'. Providing the language can boost accuracy. Although the documentation describes timestamps as incompatible, voxtral-mini-2602 accepts language=en with timestamp_granularities=segment (observed 2026-10-25)."
  - target: $.components.schemas.AudioTranscriptionRequest.properties.file_url
    update:
      description: "HTTP(S) URL of a file for Mistral to fetch and transcribe."
  # Mistral concatenates repeated multipart fields; send one value per field.
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.context_bias
    remove: true
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.timestamp_granularities
    remove: true
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties
    update:
      context_bias:
        type: string
        description: "Comma-separated terms, without whitespace or commas inside a term (voxtral-mini-2602); at most 100."
        pattern: '^[^,\s]+(,[^,\s]+)*$'
      timestamp_granularities:
        $ref: '#/components/schemas/TimestampGranularity'
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.temperature
    update:
      minimum: 0
      maximum: 1.5
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.diarize
    update:
      description: "Speaker diarization. When not streaming, requires timestamp_granularities=segment. Speaker IDs are speaker_1, speaker_2, and so on."
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.language
    update:
      description: "Language of the audio, e.g. 'en'. Providing the language can boost accuracy. Although the documentation describes timestamps as incompatible, voxtral-mini-2602 accepts language=en with timestamp_granularities=segment (observed 2026-10-25)."
  - target: $.components.schemas.AudioTranscriptionRequestStream.properties.file_url
    update:
      description: "HTTP(S) URL of a file for Mistral to fetch and transcribe."
  - target: $.components.schemas.TranscriptionSegmentChunk
    update:
      additionalProperties: true
      description: "A timed transcription chunk. With timestamp_granularities=word, voxtral-mini-2602 returns one transcription_segment chunk per word, with a leading space, rather than a separate word list. With diarize=true, speaker_id is speaker_1, speaker_2, and so on (observed 2026-10-25)."
  - target: $.paths['/v1/audio/transcriptions'].post.responses
    update:
      '401':
        description: Invalid API key
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationErrorResponse'
  - target: $.paths['/v1/audio/transcriptions#stream'].post.responses
    update:
      '401':
        description: Invalid API key
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationErrorResponse'
      '400':
        description: Invalid model or request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIError'
      '422':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIError'
  # Segment type labels are extensible; unknown values must not discard a response.
  - target: $.components.schemas.TranscriptionSegmentChunk.properties.type.enum
    remove: true
  - target: $.components.schemas.TranscriptionSegmentChunk.properties.type
    update:
      description: "Chunk type, normally transcription_segment. Preserve unknown type labels from future API responses."
